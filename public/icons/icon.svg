<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Star of David -->
  <g transform="translate(256, 210)" fill="white">
    <!-- Triangle haut -->
    <polygon points="0,-80 69.3,40 -69.3,40" fill="none" stroke="white" stroke-width="18" stroke-linejoin="round"/>
    <!-- Triangle bas -->
    <polygon points="0,80 69.3,-40 -69.3,-40" fill="none" stroke="white" stroke-width="18" stroke-linejoin="round"/>
  </g>
  <!-- Texte GAN -->
  <text x="256" y="390" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle" letter-spacing="8">GAN</text>
  <!-- Texte ISRAEL -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="40" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="4">ISRAEL</text>
</svg>
